<!doctype html>

          <div class="styles__FocusWrapper-sc-1rwpktv-1 hiWZTo">

                      <div class="styles__InputContainer-p0pggb-0 klKWJU customStyles-input-input-container">

            </div>
            <!-- mrp -->

              <div class="styles__EditAttributeNameWrapper-sc-1wzbcae-1 hTwia">

  <!-- Collapsed section: Product Description -->
  <div class="styles__Card-sc-1ipgdlp-0 kYHBlh">

      <div class="styles__Wrapper-oojhsj-1 dRcvGH">

      <div class="styles__Wrapper-oojhsj-1 htzeZG" id="product-description-body"></div>
    </div>

  <script>
    (function () {
      const body = document.getElementById('product-description-body');
      const card = body.closest('[class*="styles__Card-"]');
      const editBtn = card.querySelector('button');
      editBtn.addEventListener('click', () => {
        body.innerHTML = [
          '<div class="styles__WebsiteSection-sc-1ipgdlp-7 xfuvk">',
          '  <div class="styles__FocusWrapper-sc-1rwpktv-1 hiWZTo">',
          '    <div class="styles__EditAttributeItemWrapper-sc-1wzbcae-0 hEiTmZ">',
          '      <div class="styles__EditAttributeNameWrapper-sc-1wzbcae-1 hTwia">',
          '        <div class="styles__AttributeItemLabelName-sc-12h9db6-1 flnEGN">Product Description <sup class="mandatory-star__MandatoryStarContainer-f6uqao-0 cVlCdP">*</sup></div>',
          '      </div>',
          '      <div class="styles__EditAttributeFieldWrapper-sc-1wzbcae-2 bNvCPs">',
          '        <textarea id="product_description" name="product_description_0_value" rows="4"></textarea>',
          '      </div>',
          '    </div>',
          '  </div>',
          '</div>',
          '<a class="styles__ModalCancelBtn-sc-15uuf5r-0 scybi">Cancel</a>'
        ].join('\n');
        const cancel = body.querySelector('a');
        cancel.addEventListener('click', () => { body.innerHTML = ''; });
      });
    })();
  </script>

</html>
