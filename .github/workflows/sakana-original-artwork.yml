name: Install original Sakana artwork

on:
  push:
    branches: [feat/local-test-gui]
    paths:
      - .github/workflows/sakana-original-artwork.yml
      - gui/sakana_toy.py

permissions:
  contents: write

jobs:
  install-original-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-test-gui
      - name: Download original artwork bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output gui/assets/sakana_character.jpg 'https://at.adobe.com/ZMFjiiaulAUnJtSM'
          printf '%s  %s\n' '33c2813580e5fcb9cdb922ddf18bc8fa7a448339d1cb564fbf24ec08b97cd5f6' 'gui/assets/sakana_character.jpg' | sha256sum --check --strict
          test "$(wc -c < gui/assets/sakana_character.jpg)" -eq 121465
      - name: Commit original artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui/assets/sakana_character.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(gui): restore original Sakana artwork bytes'
          git push origin HEAD:feat/local-test-gui
