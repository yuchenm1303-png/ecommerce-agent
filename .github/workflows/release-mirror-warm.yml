name: Warm Stable Mirrors

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Publish Update"
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/release-mirror-warm.yml"

permissions:
  contents: read

concurrency:
  group: warm-stable-mirrors
  cancel-in-progress: false

jobs:
  warm-stable-mirrors:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      WARM_URL: https://nfzkphjbelyltrzgkdwt.supabase.co/functions/v1/portal-release-warm

    steps:
      - name: Resolve latest Stable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest release is not a Stable tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Warming mirrors for $tag"

      - name: Warm update and installer mirrors
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Mirror warm attempt ${attempt}/12 for ${RELEASE_TAG}"
            payload="$(jq -cn --arg tag "$RELEASE_TAG" '{tag:$tag}')"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$WARM_URL")"

            ready="$(jq -r '.ready // false' <<<"$response")"
            update_ready="$(jq -r '.updateMirrorReady // false' <<<"$response")"
            installer_ready="$(jq -r '.installerMirrorReady // false' <<<"$response")"
            echo "ready=$ready updateMirrorReady=$update_ready installerMirrorReady=$installer_ready"

            if [[ "$ready" == "true" ]]; then
              echo "Stable mirrors are ready for ${RELEASE_TAG}"
              exit 0
            fi
            sleep 8
          done

          echo "Stable mirrors did not become ready after 12 bounded attempts" >&2
          exit 1
