name: AV Compatibility Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diagnostic-installers:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 01-baseline-0.1.2
            ref: f554e45448368a3d1437340c405505350a27f7f7
            version: 0.1.3-diag-baseline
          - label: 02-secure-updater
            ref: 29e65765f54dad428ca6318c47f35b4669e90a75
            version: 0.1.3-diag-updater
          - label: 03-app-access-active
            ref: 9f24722e09676debc54136b125a0766c4042a610
            version: 0.1.3-diag-access

    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build isolated diagnostic installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version "${{ matrix.version }}"

      - name: Record diagnostic metadata
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts\EcommerceAgent-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Diagnostic installer not found" }
          $sha = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $source = (git rev-parse HEAD).Trim()
          @(
            "label=${{ matrix.label }}",
            "source_commit=$source",
            "build_version=${{ matrix.version }}",
            "sha256=$sha",
            "size=$($setup.Length)"
          ) | Set-Content artifacts\diagnostic.txt -Encoding utf8
          Get-Content artifacts\diagnostic.txt

      - name: Upload diagnostic installer
        uses: actions/upload-artifact@v4
        with:
          name: AV-${{ matrix.label }}-${{ github.run_id }}
          path: |
            artifacts/EcommerceAgent-Setup-*.exe
            artifacts/diagnostic.txt
          if-no-files-found: error
          retention-days: 3
