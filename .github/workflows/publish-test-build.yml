name: Publish Test Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to build"
        required: true
        default: "feat/local-test-gui"
        type: string
      package_version:
        description: "Package version for this prerelease"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-test-build:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      GH_TOKEN: ${{ github.token }}
      VELOPACK_CHANNEL: win-x64-test

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve test build identity
        id: build
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          $version = $env:PACKAGE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version: $version" }
          $tag = "test-$version-$short-${{ github.run_number }}"
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Set-Content "packaging\VERSION" $version -Encoding ascii -NoNewline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt
          dotnet tool restore

      - name: Velopack contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_velopack_update_contract.py `
            tests/test_app_update_ui_contract.py `
            tests/test_updater_browser_shutdown_contract.py

      - name: Build branded test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          "Pre-release validation build from ${{ steps.build.outputs.sha }}" | Set-Content artifacts\test-notes.md -Encoding utf8
          .\scripts\build_windows.ps1 `
            -Version "${{ steps.build.outputs.version }}" `
            -Channel $env:VELOPACK_CHANNEL `
            -ReleaseNotesPath "artifacts\test-notes.md"

      - name: Validate local prerelease assets
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $dir = "artifacts\velopack"
          $feedPath = Join-Path $dir "releases.$env:VELOPACK_CHANNEL.json"
          if (-not (Test-Path $feedPath)) { throw "Velopack prerelease feed missing: $feedPath" }
          $feed = Get-Content $feedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $target = @($feed.Assets | Where-Object {
            [string]$_.PackageId -eq "Smirel.ListingStudio" -and
            [string]$_.Version -eq $version -and
            [string]$_.Type -eq "Full"
          })
          if ($target.Count -ne 1) { throw "Velopack prerelease feed does not contain exactly one target Full release" }
          $targetFull = [string]$target[0].FileName
          if ([string]::IsNullOrWhiteSpace($targetFull) -or [IO.Path]::GetFileName($targetFull) -ne $targetFull) {
            throw "Unsafe prerelease target package filename: $targetFull"
          }
          $targetPath = Join-Path $dir $targetFull
          if (-not (Test-Path $targetPath -PathType Leaf)) { throw "Prerelease target package missing: $targetPath" }
          if ([int64]$target[0].Size -ne [int64](Get-Item $targetPath).Length) { throw "Prerelease target package size mismatch" }

          $nativeSetup = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Setup.exe")
          $nativeMsi = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*.msi")
          $nativePortable = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Portable.zip")
          if ($nativeSetup.Count -ne 1) { throw "Expected exactly one native test Setup, found $($nativeSetup.Count)" }
          if ($nativeMsi.Count -ne 1) { throw "Expected exactly one native test MSI, found $($nativeMsi.Count)" }
          if ($nativePortable.Count -ne 1) { throw "Expected exactly one native test Portable, found $($nativePortable.Count)" }
          foreach ($required in @(
            "artifacts\EcommerceAgent-Setup-$version.exe",
            "artifacts\EcommerceAgent-Setup-$version.msi",
            "artifacts\EcommerceAgent-$version-portable.zip"
          )) {
            if (-not (Test-Path $required)) { throw "Prerelease friendly asset missing before publish: $required" }
          }
          "target_full=$targetFull" >> $env:GITHUB_ENV
          "native_setup=$($nativeSetup[0].Name)" >> $env:GITHUB_ENV
          "native_msi=$($nativeMsi[0].Name)" >> $env:GITHUB_ENV
          "native_portable=$($nativePortable[0].Name)" >> $env:GITHUB_ENV

      - name: Silent Velopack Setup smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $setup = "artifacts\EcommerceAgent-Setup-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "ListingStudioTestSmoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "--silent", "--installto", $installDir
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Velopack install failed: $($process.ExitCode)" }
          $stub = Join-Path $installDir "EcommerceAgent.exe"
          $worker = Join-Path $installDir "current\EcommerceAgentWorker.exe"
          $versionFile = Join-Path $installDir "current\_internal\packaging\VERSION"
          foreach ($required in @($stub, $worker, $versionFile, (Join-Path $installDir "Update.exe"))) {
            if (-not (Test-Path $required)) { throw "Installed component missing: $required" }
          }
          & $worker --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed worker self-test failed: $LASTEXITCODE" }
          if ((Get-Content $versionFile -Raw).Trim() -ne $version) { throw "Embedded VERSION mismatch" }

      - name: Stage prerelease Velopack assets as draft
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run vpk -- upload github `
            --outputDir "artifacts\velopack" `
            --channel $env:VELOPACK_CHANNEL `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --publish false `
            --pre true `
            --releaseName "Listing Studio Test ${{ steps.build.outputs.version }} (${{ steps.build.outputs.short }})" `
            --tag "${{ steps.build.outputs.tag }}" `
            --targetCommitish "${{ steps.build.outputs.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Velopack prerelease draft upload failed: $LASTEXITCODE" }
          gh release upload "${{ steps.build.outputs.tag }}" `
            "artifacts\EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe" `
            "artifacts\EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi" `
            "artifacts\EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Friendly prerelease asset upload failed: $LASTEXITCODE" }

      - name: Verify complete prerelease draft
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $draft = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($draft.tagName -ne $tag) { throw "Test draft tag mismatch" }
          if (-not $draft.isDraft) { throw "Test release became public before verification" }
          if (-not $draft.isPrerelease) { throw "Test draft is not marked prerelease" }
          $names = @($draft.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            $env:target_full,
            "releases.$env:VELOPACK_CHANNEL.json",
            $env:native_setup,
            $env:native_msi,
            $env:native_portable,
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe",
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi",
            "EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip"
          )) {
            if ([string]::IsNullOrWhiteSpace($expected) -or $expected -notin $names) {
              throw "Draft prerelease asset missing: $expected"
            }
          }

      - name: Publish verified prerelease
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified prerelease: $LASTEXITCODE" }

      - name: Verify published prerelease contract
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $release = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Published test tag mismatch" }
          if ($release.isDraft) { throw "Test release is still a draft" }
          if (-not $release.isPrerelease) { throw "Test release was not published as prerelease" }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            $env:target_full,
            "releases.$env:VELOPACK_CHANNEL.json",
            $env:native_setup,
            $env:native_msi,
            $env:native_portable,
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe",
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi",
            "EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip"
          )) {
            if ([string]::IsNullOrWhiteSpace($expected) -or $expected -notin $names) {
              throw "Published prerelease asset missing: $expected"
            }
          }

      - name: Prune old test prereleases
        shell: pwsh
        run: |
          $all = gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt | ConvertFrom-Json
          $tests = @($all | Where-Object {
            $_.isPrerelease -and -not $_.isDraft -and [string]$_.tagName -like "test-*"
          } | Sort-Object { [datetime]$_.createdAt } -Descending)
          foreach ($old in @($tests | Select-Object -Skip 3)) {
            Write-Host "Pruning old test prerelease $($old.tagName)"
            gh release delete $old.tagName --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to prune old test prerelease $($old.tagName)" }
          }

      - name: Cleanup failed prerelease draft
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { exit 0 }
          $raw = gh release view $tag --json isDraft,tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            Write-Host "No test release exists for cleanup: $tag"
            exit 0
          }
          $release = $raw | ConvertFrom-Json
          if ($release.isDraft) {
            Write-Host "Removing failed test draft $tag"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup test draft $tag" }
          }
          else {
            Write-Warning "Test release $tag is already public; automatic cleanup intentionally refused"
          }

      - name: Upload test build files to workflow run
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Test-${{ steps.build.outputs.tag }}
          path: |
            artifacts/EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe
            artifacts/EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi
            artifacts/EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip
            artifacts/velopack/*
          if-no-files-found: error
          retention-days: 7
