name: Publish Test Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to build"
        required: true
        default: "feat/local-test-gui"
        type: string
      package_version:
        description: "Package version for this prerelease"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-test-build
  cancel-in-progress: false

jobs:
  publish-test-build:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      GH_TOKEN: ${{ github.token }}
      VELOPACK_CHANNEL: win-x64-test

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve and preflight test release identity
        id: build
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          $version = $env:PACKAGE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package version: $version" }
          $tag = "test-$version-$short-${{ github.run_number }}"
          $releaseName = "Listing Studio Test $version ($short) #${{ github.run_number }}"

          $remoteTag = (& git ls-remote --tags origin "refs/tags/$tag" 2>$null | Out-String).Trim()
          $global:LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) { throw "Test tag already exists: $tag" }
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) { throw "Test release already exists: $tag" }

          $releases = gh release list --limit 1000 --json name,tagName | ConvertFrom-Json
          if (@($releases | Where-Object { [string]$_.name -eq $releaseName }).Count -gt 0) {
            throw "Test release name already exists: $releaseName"
          }

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          Write-Host "Test identity preflight passed: tag=$tag name='$releaseName'"

      - name: Prepare workflow-safe test tag
        id: release_tag
        shell: pwsh
        run: |
          .\scripts\prepare_release_tag.ps1 `
            -SourceSha "${{ steps.build.outputs.sha }}" `
            -Tag "${{ steps.build.outputs.tag }}" `
            -Version "${{ steps.build.outputs.version }}"

      - name: Create empty prerelease draft before build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @(
            "# $env:RELEASE_NAME", "",
            "Pre-release validation build.", "",
            "Source commit: ${{ steps.build.outputs.sha }}", "",
            "Release snapshot: ${{ steps.release_tag.outputs.snapshot_sha }}"
          ) | Set-Content "artifacts\test-notes.md" -Encoding utf8

          $tag = "${{ steps.build.outputs.tag }}"
          gh release create $tag `
            --verify-tag `
            --draft `
            --prerelease `
            --title "$env:RELEASE_NAME" `
            --notes-file "artifacts\test-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "GitHub prerelease draft preflight failed before build: $LASTEXITCODE" }
          $draft = gh release view $tag --json tagName,name,isDraft,isPrerelease | ConvertFrom-Json
          if ($draft.tagName -ne $tag -or $draft.name -ne $env:RELEASE_NAME -or -not $draft.isDraft -or -not $draft.isPrerelease) {
            throw "Fresh test draft identity mismatch"
          }
          Write-Host "GitHub prerelease draft creation passed before heavy build"

      - name: Stamp package version
        shell: pwsh
        run: |
          Set-Content "packaging\VERSION" "${{ steps.build.outputs.version }}" -Encoding ascii -NoNewline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt
          dotnet tool restore

      - name: Velopack contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_velopack_update_contract.py `
            tests/test_app_update_ui_contract.py `
            tests/test_updater_browser_shutdown_contract.py

      - name: Build branded test package
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 `
            -Version "${{ steps.build.outputs.version }}" `
            -Channel $env:VELOPACK_CHANNEL `
            -ReleaseNotesPath "artifacts\test-notes.md"

      - name: Validate local prerelease assets
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $dir = "artifacts\velopack"
          $feedPath = Join-Path $dir "releases.$env:VELOPACK_CHANNEL.json"
          if (-not (Test-Path $feedPath)) { throw "Velopack prerelease feed missing: $feedPath" }
          $feed = Get-Content $feedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $target = @($feed.Assets | Where-Object {
            [string]$_.PackageId -eq "Smirel.ListingStudio" -and
            [string]$_.Version -eq $version -and
            [string]$_.Type -eq "Full"
          })
          if ($target.Count -ne 1) { throw "Velopack prerelease feed must contain exactly one target Full release" }
          $targetFull = [string]$target[0].FileName
          $targetPath = Join-Path $dir $targetFull
          if ([IO.Path]::GetFileName($targetFull) -ne $targetFull -or -not (Test-Path $targetPath -PathType Leaf)) {
            throw "Invalid prerelease target package: $targetFull"
          }
          if ([int64]$target[0].Size -ne [int64](Get-Item $targetPath).Length) { throw "Prerelease feed/package size mismatch" }
          foreach ($required in @(
            "artifacts\EcommerceAgent-Setup-$version.exe",
            "artifacts\EcommerceAgent-Setup-$version.msi",
            "artifacts\EcommerceAgent-$version-portable.zip"
          )) {
            if (-not (Test-Path $required)) { throw "Prerelease friendly asset missing: $required" }
          }

      - name: Silent branded MSI install and uninstall smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          .\scripts\test_velopack_msi.ps1 `
            -MsiPath "artifacts\EcommerceAgent-Setup-$version.msi" `
            -ExpectedVersion $version `
            -InstallDir (Join-Path $env:RUNNER_TEMP "ListingStudioTestMsiSmoke")

      - name: Silent Velopack Setup smoke test
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $setup = "artifacts\EcommerceAgent-Setup-$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "ListingStudioTestSmoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @("--silent", "--installto", $installDir) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Velopack test Setup failed: $($process.ExitCode)" }
          foreach ($required in @(
            (Join-Path $installDir "EcommerceAgent.exe"),
            (Join-Path $installDir "Update.exe"),
            (Join-Path $installDir "current\EcommerceAgentWorker.exe"),
            (Join-Path $installDir "current\_internal\packaging\VERSION")
          )) {
            if (-not (Test-Path $required)) { throw "Installed test component missing: $required" }
          }
          if ((Get-Content (Join-Path $installDir "current\_internal\packaging\VERSION") -Raw).Trim() -ne $version) {
            throw "Embedded test VERSION mismatch"
          }

      - name: Upload verified assets to existing prerelease draft
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $native = @(Get-ChildItem "artifacts\velopack" -File | ForEach-Object { $_.FullName })
          if ($native.Count -eq 0) { throw "No prerelease Velopack assets available" }
          & gh release upload $tag @native --clobber
          if ($LASTEXITCODE -ne 0) { throw "Native prerelease asset upload failed: $LASTEXITCODE" }
          & gh release upload $tag `
            "artifacts\EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe" `
            "artifacts\EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi" `
            "artifacts\EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Friendly prerelease asset upload failed: $LASTEXITCODE" }

      - name: Verify complete prerelease draft
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          $draft = gh release view $tag --json tagName,name,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($draft.tagName -ne $tag -or $draft.name -ne $env:RELEASE_NAME) { throw "Test draft identity mismatch" }
          if (-not $draft.isDraft -or -not $draft.isPrerelease) { throw "Test draft flags invalid" }
          $names = @($draft.assets | ForEach-Object { $_.name })
          $expected = @((Get-ChildItem "artifacts\velopack" -File | ForEach-Object { $_.Name })) + @(
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe",
            "EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi",
            "EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip"
          )
          foreach ($name in $expected) {
            if ($name -notin $names) { throw "Draft prerelease asset missing: $name" }
          }

      - name: Publish verified prerelease
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified prerelease: $LASTEXITCODE" }

      - name: Prune old test prereleases
        shell: pwsh
        run: |
          $all = gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt | ConvertFrom-Json
          $tests = @($all | Where-Object {
            $_.isPrerelease -and -not $_.isDraft -and [string]$_.tagName -like "test-*"
          } | Sort-Object { [datetime]$_.createdAt } -Descending)
          foreach ($old in @($tests | Select-Object -Skip 3)) {
            gh release delete $old.tagName --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to prune old prerelease $($old.tagName)" }
          }

      - name: Cleanup failed prerelease draft and tag
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $tag = "${{ steps.build.outputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { exit 0 }
          $raw = gh release view $tag --json isDraft,tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $raw | ConvertFrom-Json
            if ($release.isDraft) {
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup prerelease draft $tag" }
              exit 0
            }
            Write-Warning "Test release $tag is already public; cleanup refused"
            exit 0
          }
          $global:LASTEXITCODE = 0
          $remoteTag = (& git ls-remote --tags origin "refs/tags/$tag" 2>$null | Out-String).Trim()
          $global:LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
            & git push origin ":refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup orphan test tag $tag" }
          }

      - name: Upload test build files to workflow run
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Test-${{ steps.build.outputs.tag }}
          path: |
            artifacts/EcommerceAgent-Setup-${{ steps.build.outputs.version }}.exe
            artifacts/EcommerceAgent-Setup-${{ steps.build.outputs.version }}.msi
            artifacts/EcommerceAgent-${{ steps.build.outputs.version }}-portable.zip
            artifacts/velopack/*
          if-no-files-found: error
          retention-days: 7
