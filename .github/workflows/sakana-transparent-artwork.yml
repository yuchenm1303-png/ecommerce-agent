name: Install transparent Sakana artwork

on:
  push:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy exact transparent source asset
        env:
          SAKANA_ART_URL: https://at.adobe.com/KsYgBtkpFGZQgV0n
          EXPECTED_SHA256: 35496769592b240a21fb5f0170baeb9df5506278162b86659cee5a7cf3e5b342
          EXPECTED_SIZE: "1268312"
        run: |
          set -euo pipefail
          mkdir -p gui/assets
          curl -L --fail --silent --show-error "$SAKANA_ART_URL" -o gui/assets/sakana_character.png
          test "$(wc -c < gui/assets/sakana_character.png)" -eq "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  gui/assets/sakana_character.png" | sha256sum -c -
          rm -f gui/assets/sakana_character.jpg
      - name: Commit asset bytes
        run: |
          set -euo pipefail
          git add gui/assets/sakana_character.png gui/assets/sakana_character.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(gui): install transparent Sakana artwork"
          git push
