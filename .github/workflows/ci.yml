name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  makro-multi-account-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Makro account isolation and task ownership
        run: |
          pytest -q \
            tests/test_channel_accounts.py \
            tests/test_batch_account_lanes.py \
            tests/test_makro_multi_account_task_binding.py \
            tests/test_batch_individual_controls_contract.py \
            tests/test_batch_auto_execute_contract.py \
            tests/test_listing_photo_ownership_contract.py \
            tests/test_listing_offer_support_contract.py \
            tests/test_makro_multi_account_ui_contract.py

  windows-updater-contract:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-release.lock

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Install pinned updater runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { throw "Updater runtime dependency install failed: $LASTEXITCODE" }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "Pinned Velopack CLI restore failed: $LASTEXITCODE" }
          dotnet tool run vpk -- --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Pinned Velopack CLI failed to start: $LASTEXITCODE" }

      - name: Verify Windows installer and lifecycle contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_velopack_lifecycle_api.py `
            tests/test_velopack_update_contract.py `
            tests/test_updater_browser_shutdown_contract.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  production-contract:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production architecture contracts
        run: |
          pytest -q \
            tests/test_production_entry_contract.py \
            tests/test_ai_first_architecture.py \
            tests/test_batch_architecture_contract.py

      - name: Verify packaged production worker routing
        run: python run_packaged_worker.py --self-test

  legacy-mock-e2e:
    runs-on: ubuntu-latest
    needs: production-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start legacy mock seller site
        run: |
          python -m http.server 8000 --directory mock_site >/tmp/mock-site.log 2>&1 &
          sleep 1

      - name: Run legacy browser automation dry-run
        run: python main.py --headless --dry-run

      - name: Run browser probe tests
        run: pytest -q -m probe
