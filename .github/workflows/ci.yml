name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

  gui-smoke:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GUI dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-gui.txt

      - name: Load Qt Quick shell offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          QSG_RHI_BACKEND: software
          QSG_RENDER_LOOP: basic
        run: python scripts/gui_qml_smoke.py

  mock-e2e:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start mock seller site
        run: |
          python -m http.server 8000 --directory mock_site >/tmp/mock-site.log 2>&1 &
          sleep 1

      - name: Run browser automation dry-run
        run: python main.py --headless --dry-run

      - name: Run browser probe tests
        run: pytest -q -m probe
