name: ci

on:
  push:
    branches: [main, feat/local-test-gui]
  pull_request:

jobs:
  makro-multi-account-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Makro account isolation and task ownership
        run: |
          pytest -q \
            tests/test_channel_accounts.py \
            tests/test_batch_account_lanes.py \
            tests/test_makro_multi_account_task_binding.py \
            tests/test_batch_individual_controls_contract.py \
            tests/test_listing_photo_ownership_contract.py \
            tests/test_listing_offer_support_contract.py \
            tests/test_makro_multi_account_ui_contract.py

  taxonomy-scroll-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile taxonomy modules
        run: |
          python -m py_compile \
            app/makro/catalog_taxonomy.py \
            app/makro/taxonomy_resilient.py

      - name: Verify fractional-end and real-stall taxonomy behavior
        run: pytest -q tests/test_taxonomy_resilient_browse.py

  windows-updater-contract:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-release.lock

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Install pinned updater runtime
        shell: pwsh
        run: |
          python -m pip install -r requirements-release.lock
          if ($LASTEXITCODE -ne 0) { throw "Updater runtime dependency install failed: $LASTEXITCODE" }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "Pinned Velopack CLI restore failed: $LASTEXITCODE" }
          dotnet tool run vpk -- --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "Pinned Velopack CLI failed to start: $LASTEXITCODE" }

      - name: Compile native installer bootstrapper before heavy build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere -PathType Leaf)) { throw "Visual Studio Build Tools locator missing: $vswhere" }
          $vsRoot = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -latest -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsRoot)) { throw "MSVC Build Tools workload is missing" }
          $msbuild = Join-Path $vsRoot "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild native\installer-bootstrapper\EcommerceAgentInstaller.vcxproj /restore /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "Native installer bootstrapper compile failed: $LASTEXITCODE" }

      - name: Verify Windows installer and release contracts before heavy build
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_release_parity_contract.py `
            tests/test_windows_packaging_contract.py `
            tests/test_customer_installer_contract.py `
            tests/test_velopack_lifecycle_api.py `
            tests/test_velopack_update_contract.py `
            tests/test_updater_browser_shutdown_contract.py

  windows-installer-e2e:
    runs-on: windows-2025
    needs: windows-updater-contract
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-release.lock

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Install isolated release environment
        shell: pwsh
        run: .\scripts\install_release_environment.ps1

      - name: Build and prove install-update-restart-uninstall
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 `
            -Version "0.0.2" `
            -Channel "win-x64-ci" `
            -RunUpdateE2E

  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-gui.txt

      - name: Run unit tests
        run: pytest -q

  production-contract:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production architecture contracts
        run: |
          pytest -q \
            tests/test_production_entry_contract.py \
            tests/test_ai_first_architecture.py \
            tests/test_batch_architecture_contract.py

      - name: Verify packaged production worker routing
        run: python run_packaged_worker.py --self-test

  legacy-mock-e2e:
    runs-on: ubuntu-latest
    needs: production-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start legacy mock seller site
        run: |
          python -m http.server 8000 --directory mock_site >/tmp/mock-site.log 2>&1 &
          sleep 1

      - name: Run legacy browser automation dry-run
        run: python main.py --headless --dry-run

      - name: Run browser probe tests
        run: pytest -q -m probe
