name: Publish Update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to publish"
        required: true
        default: "feat/local-test-gui"
        type: string
      version:
        description: "New Stable version (strict x.y.z)"
        required: true
        type: string
      title:
        description: "Release title"
        required: false
        default: "Listing Studio Stable Update"
        type: string
      release_notes:
        description: "User-facing release notes"
        required: true
        default: "稳定性与上架流程优化。"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-stable-update
  cancel-in-progress: false

jobs:
  publish-stable-update:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      UPDATE_VERSION: ${{ inputs.version }}
      UPDATE_TITLE: ${{ inputs.title }}
      UPDATE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
      VELOPACK_CHANNEL: win-x64-stable

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Capture source commit
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing source $env:SOURCE_REF at $sha"

      - name: Validate monotonic Stable version
        shell: pwsh
        run: |
          if ($env:UPDATE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be strict x.y.z: $env:UPDATE_VERSION"
          }
          $releaseVersion = [version]$env:UPDATE_VERSION
          $latestRaw = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $latestTag = ($latestRaw | Out-String).Trim()
            if ($latestTag -match '^v(\d+\.\d+\.\d+)$') {
              $latestVersion = [version]$Matches[1]
              if ($releaseVersion -le $latestVersion) {
                throw "New Stable $releaseVersion must be newer than $latestVersion"
              }
            }
          }
          $global:LASTEXITCODE = 0
          $tag = "v$env:UPDATE_VERSION"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) { throw "Release already exists: $tag" }

      - name: Stamp package version and release notes
        shell: pwsh
        run: |
          Set-Content "packaging\VERSION" $env:UPDATE_VERSION -Encoding ascii -NoNewline
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @(
            "# $env:UPDATE_TITLE", "", $env:UPDATE_NOTES, "",
            "Source commit: ${{ steps.source.outputs.sha }}"
          ) | Set-Content "artifacts\release-notes.md" -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt
          dotnet tool restore

      - name: Velopack update contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_velopack_update_contract.py `
            tests/test_app_update_ui_contract.py `
            tests/test_updater_browser_shutdown_contract.py

      - name: Build and run real Velopack update E2E
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 `
            -Version $env:UPDATE_VERSION `
            -Channel $env:VELOPACK_CHANNEL `
            -ReleaseNotesPath "artifacts\release-notes.md" `
            -RunUpdateE2E

      - name: Validate local branded Velopack release assets
        shell: pwsh
        run: |
          $dir = "artifacts\velopack"
          $feedPath = Join-Path $dir "releases.$env:VELOPACK_CHANNEL.json"
          if (-not (Test-Path $feedPath)) { throw "Velopack feed missing: $feedPath" }
          $feed = Get-Content $feedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $target = @($feed.Assets | Where-Object {
            [string]$_.PackageId -eq "Smirel.ListingStudio" -and
            [string]$_.Version -eq $env:UPDATE_VERSION -and
            [string]$_.Type -eq "Full"
          })
          if ($target.Count -ne 1) { throw "Velopack feed does not contain exactly one target Full release" }
          $targetFull = [string]$target[0].FileName
          if ([string]::IsNullOrWhiteSpace($targetFull) -or [IO.Path]::GetFileName($targetFull) -ne $targetFull) {
            throw "Unsafe target package filename in Velopack feed: $targetFull"
          }
          $targetPath = Join-Path $dir $targetFull
          if (-not (Test-Path $targetPath -PathType Leaf)) { throw "Feed target package missing: $targetPath" }
          if ([int64]$target[0].Size -ne [int64](Get-Item $targetPath).Length) {
            throw "Feed target package size mismatch: $targetFull"
          }

          $nativeSetup = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Setup.exe")
          $nativeMsi = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*.msi")
          $nativePortable = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Portable.zip")
          if ($nativeSetup.Count -ne 1) { throw "Expected exactly one native Velopack Setup, found $($nativeSetup.Count)" }
          if ($nativeMsi.Count -ne 1) { throw "Expected exactly one native Velopack MSI, found $($nativeMsi.Count)" }
          if ($nativePortable.Count -ne 1) { throw "Expected exactly one native Velopack Portable, found $($nativePortable.Count)" }

          $friendlySetup = Get-Item "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          $friendlyMsi = Get-Item "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi"
          $friendlyPortable = Get-Item "artifacts\EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          $friendlySetupSha = (Get-FileHash $friendlySetup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $friendlyMsiSha = (Get-FileHash $friendlyMsi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          "target_full=$targetFull" >> $env:GITHUB_ENV
          "native_setup=$($nativeSetup[0].Name)" >> $env:GITHUB_ENV
          "native_msi=$($nativeMsi[0].Name)" >> $env:GITHUB_ENV
          "native_portable=$($nativePortable[0].Name)" >> $env:GITHUB_ENV
          "friendly_setup_sha=$friendlySetupSha" >> $env:GITHUB_ENV
          "friendly_setup_size=$($friendlySetup.Length)" >> $env:GITHUB_ENV
          "friendly_msi_sha=$friendlyMsiSha" >> $env:GITHUB_ENV
          "friendly_msi_size=$($friendlyMsi.Length)" >> $env:GITHUB_ENV
          Write-Host "Velopack target Full asset: $targetFull"
          Write-Host "Friendly MSI SHA256: $friendlyMsiSha"

      - name: Silent branded MSI install and uninstall smoke test
        shell: pwsh
        run: |
          .\scripts\test_velopack_msi.ps1 `
            -MsiPath "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi" `
            -ExpectedVersion $env:UPDATE_VERSION `
            -InstallDir (Join-Path $env:RUNNER_TEMP "ListingStudioStableMsiSmoke")

      - name: Silent Velopack Setup smoke test
        shell: pwsh
        run: |
          $setup = "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "Setup missing: $setup" }
          $installDir = Join-Path $env:RUNNER_TEMP "ListingStudioStableSmoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "--silent", "--installto", $installDir
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Velopack install failed: $($process.ExitCode)" }
          $stub = Join-Path $installDir "EcommerceAgent.exe"
          $versionFile = Join-Path $installDir "current\_internal\packaging\VERSION"
          $worker = Join-Path $installDir "current\EcommerceAgentWorker.exe"
          $update = Join-Path $installDir "Update.exe"
          foreach ($required in @($stub, $versionFile, $worker, $update)) {
            if (-not (Test-Path $required)) { throw "Installed component missing: $required" }
          }
          if ((Get-Content $versionFile -Raw).Trim() -ne $env:UPDATE_VERSION) {
            throw "Installed VERSION mismatch"
          }
          & $worker --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed worker self-test failed: $LASTEXITCODE" }

      - name: Stage Velopack Stable release as draft
        shell: pwsh
        env:
          VPK_TOKEN: ${{ github.token }}
        run: |
          dotnet tool run vpk -- upload github `
            --outputDir "artifacts\velopack" `
            --channel $env:VELOPACK_CHANNEL `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --publish false `
            --releaseName "$env:UPDATE_TITLE v$env:UPDATE_VERSION" `
            --tag "v$env:UPDATE_VERSION" `
            --targetCommitish "${{ steps.source.outputs.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Velopack GitHub draft upload failed: $LASTEXITCODE" }

          gh release upload "v$env:UPDATE_VERSION" `
            "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe" `
            "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi" `
            "artifacts\EcommerceAgent-$env:UPDATE_VERSION-portable.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Friendly release asset upload failed: $LASTEXITCODE" }

      - name: Verify complete draft before publication
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $draft = gh release view $tag --json databaseId,tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($draft.tagName -ne $tag) { throw "Draft tag mismatch" }
          if (-not $draft.isDraft) { throw "Velopack release became public before verification" }
          if ($draft.isPrerelease) { throw "Stable draft unexpectedly marked prerelease" }
          $names = @($draft.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            $env:target_full,
            "releases.$env:VELOPACK_CHANNEL.json",
            $env:native_setup,
            $env:native_msi,
            $env:native_portable,
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe",
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.msi",
            "EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          )) {
            if ([string]::IsNullOrWhiteSpace($expected) -or $expected -notin $names) {
              throw "Draft release asset missing: $expected"
            }
          }

          $apiRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draft.databaseId)" | ConvertFrom-Json
          $friendlyMsi = @($apiRelease.assets | Where-Object { $_.name -eq "EcommerceAgent-Setup-$env:UPDATE_VERSION.msi" })
          if ($friendlyMsi.Count -ne 1) { throw "Draft branded MSI asset is not unique" }
          if ([int64]$friendlyMsi[0].size -ne [int64]$env:friendly_msi_size) { throw "Draft branded MSI size mismatch" }
          if ([string]$friendlyMsi[0].digest -ne "sha256:$env:friendly_msi_sha") { throw "Draft branded MSI SHA256 mismatch" }

      - name: Publish verified Stable release
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified Stable draft: $LASTEXITCODE" }

      - name: Verify published Velopack contract
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $release = gh release view $tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne $tag) { throw "Published tag mismatch" }
          if ($release.isDraft) { throw "Stable release is still a draft" }
          if ($release.isPrerelease) { throw "Stable release unexpectedly marked prerelease" }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            $env:target_full,
            "releases.$env:VELOPACK_CHANNEL.json",
            $env:native_setup,
            $env:native_msi,
            $env:native_portable,
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe",
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.msi",
            "EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          )) {
            if ([string]::IsNullOrWhiteSpace($expected) -or $expected -notin $names) {
              throw "Published asset missing: $expected"
            }
          }

      - name: Cleanup failed Stable draft
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $raw = gh release view $tag --json isDraft,tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            Write-Host "No release exists for cleanup: $tag"
            exit 0
          }
          $release = $raw | ConvertFrom-Json
          if ($release.isDraft) {
            Write-Host "Removing failed draft $tag so the same version can be retried cleanly"
            gh release delete $tag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup draft $tag" }
          }
          else {
            Write-Warning "Release $tag is already public; automatic cleanup intentionally refused"
          }

      - name: Upload published files to workflow run
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Stable-${{ inputs.version }}
          path: |
            artifacts/EcommerceAgent-Setup-${{ inputs.version }}.exe
            artifacts/EcommerceAgent-Setup-${{ inputs.version }}.msi
            artifacts/EcommerceAgent-${{ inputs.version }}-portable.zip
            artifacts/velopack/*
          if-no-files-found: error
          retention-days: 30
