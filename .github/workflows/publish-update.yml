name: Publish Update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to publish"
        required: true
        default: "feat/local-test-gui"
        type: string
      version:
        description: "New Stable version (strict x.y.z, for example 0.1.15)"
        required: true
        type: string
      update_type:
        description: "Update policy"
        required: true
        default: optional
        type: choice
        options:
          - optional
          - required
      min_supported_version:
        description: "Oldest supported version after this release (strict x.y.z)"
        required: true
        type: string
      title:
        description: "Update title"
        required: false
        default: "Stable Update"
        type: string
      release_notes:
        description: "User-facing update notes"
        required: true
        default: "稳定性与上架流程优化。"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-stable-update
  cancel-in-progress: false

jobs:
  publish-stable-update:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      UPDATE_VERSION: ${{ inputs.version }}
      UPDATE_TYPE: ${{ inputs.update_type }}
      MIN_SUPPORTED_VERSION: ${{ inputs.min_supported_version }}
      UPDATE_TITLE: ${{ inputs.title }}
      UPDATE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Capture source commit
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing source $env:SOURCE_REF at $sha"

      - name: Validate release inputs and monotonic Stable version
        shell: pwsh
        run: |
          if ($env:UPDATE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be strict x.y.z: $env:UPDATE_VERSION"
          }
          if ($env:MIN_SUPPORTED_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Minimum supported version must be strict x.y.z: $env:MIN_SUPPORTED_VERSION"
          }
          if ($env:UPDATE_TYPE -notin @('optional', 'required')) {
            throw "Invalid update type: $env:UPDATE_TYPE"
          }

          $releaseVersion = [version]$env:UPDATE_VERSION
          $minimumVersion = [version]$env:MIN_SUPPORTED_VERSION
          if ($minimumVersion -gt $releaseVersion) {
            throw "Minimum supported version cannot exceed release version"
          }

          $latestTag = ""
          $latestRaw = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $latestTag = ($latestRaw | Out-String).Trim()
          }
          $global:LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($latestTag)) {
            if ($latestTag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Latest published Stable version has unexpected tag: $latestTag"
            }
            $latestVersion = [version]$Matches[1]
            Write-Host "Latest published Stable version: $latestVersion"
            if ($releaseVersion -le $latestVersion) {
              throw "New Stable version $releaseVersion must be newer than current Stable $latestVersion"
            }
          }

          $tag = "v$env:UPDATE_VERSION"
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            throw "Release already exists: $tag"
          }
          Write-Host "Release tag is available: $tag"

      - name: Stamp package version
        shell: pwsh
        run: |
          Set-Content -Path "packaging\VERSION" -Value $env:UPDATE_VERSION -Encoding ascii -NoNewline
          $stamped = (Get-Content "packaging\VERSION" -Raw).Trim()
          if ($stamped -ne $env:UPDATE_VERSION) {
            throw "Failed to stamp package version: expected=$env:UPDATE_VERSION actual=$stamped"
          }
          Write-Host "Stamped packaging/VERSION = $stamped"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt

      - name: Full update-chain contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_update_delivery_contract.py `
            tests/test_updater_core_contract.py `
            tests/test_updater_browser_shutdown_contract.py `
            tests/test_update_panel_contract.py `
            tests/test_resilient_app_updater_contract.py `
            tests/test_updater_onefile_contract.py `
            tests/test_update_chain_contract.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build exact release version
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Version $env:UPDATE_VERSION

      - name: Silent installer smoke test
        shell: pwsh
        run: |
          $setup = Join-Path $PWD "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "Installer artifact not found: $setup" }
          $installDir = Join-Path $env:RUNNER_TEMP "EcommerceAgentReleaseSmoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $setupLog = Join-Path $env:RUNNER_TEMP "ecommerce-agent-release-smoke.log"
          $process = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=$setupLog"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 120 }
            throw "Silent install failed: $($process.ExitCode)"
          }

          $gui = Join-Path $installDir "EcommerceAgent.exe"
          $worker = Join-Path $installDir "EcommerceAgentWorker.exe"
          $updater = Join-Path $installDir "updater\updater.exe"
          $versionFile = Join-Path $installDir "_internal\packaging\VERSION"
          foreach ($required in @($gui, $worker, $updater, $versionFile)) {
            if (-not (Test-Path $required)) { throw "Installed package component missing: $required" }
          }
          if (Test-Path (Join-Path $installDir "updater\_internal")) {
            throw "Standalone updater unexpectedly depends on an installed _internal directory"
          }
          & $worker --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed worker self-test failed: $LASTEXITCODE" }
          & $updater --self-check
          if ($LASTEXITCODE -ne 0) { throw "Installed updater self-check failed: $LASTEXITCODE" }
          $embedded = (Get-Content $versionFile -Raw).Trim()
          if ($embedded -ne $env:UPDATE_VERSION) {
            throw "Embedded version mismatch: expected=$env:UPDATE_VERSION actual=$embedded"
          }

      - name: Generate Stable update manifest
        shell: pwsh
        run: |
          $setupName = "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          $portableName = "EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          $setup = Join-Path $PWD "artifacts\$setupName"
          $portable = Join-Path $PWD "artifacts\$portableName"
          if (-not (Test-Path $setup)) { throw "Setup missing: $setup" }
          if (-not (Test-Path $portable)) { throw "Portable package missing: $portable" }
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupSize = (Get-Item $setup).Length
          $required = $env:UPDATE_TYPE -eq 'required'
          $title = $env:UPDATE_TITLE.Trim()
          if ([string]::IsNullOrWhiteSpace($title)) { $title = "EcommerceAgent $env:UPDATE_VERSION" }
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:UPDATE_VERSION/$setupName"
          [ordered]@{
            schema_version = 1
            channel = "stable"
            version = $env:UPDATE_VERSION
            required = $required
            min_supported_version = $env:MIN_SUPPORTED_VERSION
            title = $title
            notes = $env:UPDATE_NOTES
            delivery = "portal"
            portal_url = "https://smirel.com/download/"
            installer_url = $downloadUrl
            installer_sha256 = $sha
            installer_size = $setupSize
            source_commit = "${{ steps.source.outputs.sha }}"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 4 | Set-Content "artifacts\update.json" -Encoding utf8
          @(
            "# $title", "", $env:UPDATE_NOTES, "",
            "Update policy: $env:UPDATE_TYPE",
            "Minimum supported version: $env:MIN_SUPPORTED_VERSION",
            "Source commit: ${{ steps.source.outputs.sha }}",
            "Installer SHA256: $sha"
          ) | Set-Content "artifacts\release-notes.md" -Encoding utf8

      - name: Validate generated manifest before publish
        shell: pwsh
        run: |
          $manifest = Get-Content "artifacts\update.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:UPDATE_VERSION) { throw "Manifest version mismatch" }
          if ($manifest.channel -ne "stable") { throw "Manifest channel mismatch" }
          if ($manifest.delivery -ne "portal") { throw "Manifest delivery mismatch" }
          $setup = "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          $actualSha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item $setup).Length
          if ($manifest.installer_sha256 -ne $actualSha) { throw "Manifest SHA256 mismatch" }
          if ([int64]$manifest.installer_size -ne $actualSize) { throw "Manifest installer size mismatch" }
          if ($manifest.source_commit -ne "${{ steps.source.outputs.sha }}") { throw "Manifest source commit mismatch" }

      - name: Publish Stable release
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          gh release create $tag `
            "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe" `
            "artifacts\EcommerceAgent-$env:UPDATE_VERSION-portable.zip" `
            "artifacts\update.json" `
            --target "${{ steps.source.outputs.sha }}" `
            --title "EcommerceAgent $env:UPDATE_VERSION" `
            --notes-file "artifacts\release-notes.md" `
            --latest

      - name: Verify published release contract
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.tag_name -ne $tag) { throw "Published tag mismatch" }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe",
            "EcommerceAgent-$env:UPDATE_VERSION-portable.zip",
            "update.json"
          )) {
            if ($expected -notin $names) { throw "Published asset missing: $expected" }
          }

      - name: Upload published files to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Stable-${{ inputs.version }}
          path: |
            artifacts/EcommerceAgent-Setup-${{ inputs.version }}.exe
            artifacts/EcommerceAgent-${{ inputs.version }}-portable.zip
            artifacts/update.json
          if-no-files-found: error
          retention-days: 30
