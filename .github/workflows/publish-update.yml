name: Publish Update

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch/tag/commit to publish"
        required: true
        default: "feat/local-test-gui"
        type: string
      version:
        description: "New Stable version (strict x.y.z)"
        required: true
        type: string
      title:
        description: "Release title"
        required: false
        default: "Listing Studio Stable Update"
        type: string
      release_notes:
        description: "User-facing release notes"
        required: true
        default: "稳定性与上架流程优化。"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-stable-update
  cancel-in-progress: false

jobs:
  publish-stable-update:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      UPDATE_VERSION: ${{ inputs.version }}
      UPDATE_TITLE: ${{ inputs.title }}
      UPDATE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
      VELOPACK_CHANNEL: win-x64-stable

    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Capture source commit
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing source $env:SOURCE_REF at $sha"

      - name: Preflight Stable release identity
        shell: pwsh
        run: |
          if ($env:UPDATE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be strict x.y.z: $env:UPDATE_VERSION"
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_TITLE)) {
            throw "Release title must not be empty"
          }

          $releaseVersion = [version]$env:UPDATE_VERSION
          $tag = "v$env:UPDATE_VERSION"
          $releaseName = "$env:UPDATE_TITLE v$env:UPDATE_VERSION"

          $latestRaw = & gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $latestTag = ($latestRaw | Out-String).Trim()
            if ($latestTag -match '^v(\d+\.\d+\.\d+)$') {
              $latestVersion = [version]$Matches[1]
              if ($releaseVersion -le $latestVersion) {
                throw "New Stable $releaseVersion must be newer than $latestVersion"
              }
            }
          }
          $global:LASTEXITCODE = 0

          $remoteTag = (& git ls-remote --tags origin "refs/tags/$tag" 2>$null | Out-String).Trim()
          $global:LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) { throw "Tag already exists: $tag" }

          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) { throw "Release already exists: $tag" }

          $releases = gh release list --limit 1000 --json name,tagName,isDraft,isPrerelease | ConvertFrom-Json
          $nameConflicts = @($releases | Where-Object { [string]$_.name -eq $releaseName })
          if ($nameConflicts.Count -gt 0) {
            $conflictTags = ($nameConflicts | ForEach-Object { [string]$_.tagName }) -join ", "
            throw "Release name already exists: '$releaseName' ($conflictTags)"
          }

          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          Write-Host "Stable identity preflight passed: tag=$tag name='$releaseName'"

      - name: Prepare workflow-safe release tag
        id: release_tag
        shell: pwsh
        run: |
          .\scripts\prepare_release_tag.ps1 `
            -SourceSha "${{ steps.source.outputs.sha }}" `
            -Tag "v$env:UPDATE_VERSION" `
            -Version $env:UPDATE_VERSION

      - name: Create empty Stable draft before build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @(
            "# $env:RELEASE_NAME", "", $env:UPDATE_NOTES, "",
            "Source commit: ${{ steps.source.outputs.sha }}", "",
            "Release snapshot: ${{ steps.release_tag.outputs.snapshot_sha }}"
          ) | Set-Content "artifacts\release-notes.md" -Encoding utf8

          $tag = "v$env:UPDATE_VERSION"
          gh release create $tag `
            --verify-tag `
            --draft `
            --title "$env:RELEASE_NAME" `
            --notes-file "artifacts\release-notes.md"
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub draft creation preflight failed before build: $LASTEXITCODE"
          }
          $draft = gh release view $tag --json tagName,name,isDraft,isPrerelease | ConvertFrom-Json
          if ($draft.tagName -ne $tag -or $draft.name -ne $env:RELEASE_NAME -or -not $draft.isDraft -or $draft.isPrerelease) {
            throw "Fresh Stable draft identity mismatch"
          }
          Write-Host "GitHub draft creation preflight passed before heavy build"

      - name: Stamp package version
        shell: pwsh
        run: |
          Set-Content "packaging\VERSION" $env:UPDATE_VERSION -Encoding ascii -NoNewline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt
          dotnet tool restore

      - name: Velopack update contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_velopack_update_contract.py `
            tests/test_app_update_ui_contract.py `
            tests/test_updater_browser_shutdown_contract.py

      - name: Build and run real Velopack update E2E
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 `
            -Version $env:UPDATE_VERSION `
            -Channel $env:VELOPACK_CHANNEL `
            -ReleaseNotesPath "artifacts\release-notes.md" `
            -RunUpdateE2E

      - name: Validate local branded Velopack release assets
        shell: pwsh
        run: |
          $dir = "artifacts\velopack"
          $feedPath = Join-Path $dir "releases.$env:VELOPACK_CHANNEL.json"
          if (-not (Test-Path $feedPath)) { throw "Velopack feed missing: $feedPath" }
          $feed = Get-Content $feedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $target = @($feed.Assets | Where-Object {
            [string]$_.PackageId -eq "Smirel.ListingStudio" -and
            [string]$_.Version -eq $env:UPDATE_VERSION -and
            [string]$_.Type -eq "Full"
          })
          if ($target.Count -ne 1) { throw "Velopack feed must contain exactly one target Full release" }
          $targetFull = [string]$target[0].FileName
          if ([string]::IsNullOrWhiteSpace($targetFull) -or [IO.Path]::GetFileName($targetFull) -ne $targetFull) {
            throw "Unsafe target package filename in Velopack feed: $targetFull"
          }
          $targetPath = Join-Path $dir $targetFull
          if (-not (Test-Path $targetPath -PathType Leaf)) { throw "Feed target package missing: $targetPath" }
          if ([int64]$target[0].Size -ne [int64](Get-Item $targetPath).Length) {
            throw "Feed target package size mismatch: $targetFull"
          }

          $nativeSetup = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Setup.exe")
          $nativeMsi = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*.msi")
          $nativePortable = @(Get-ChildItem $dir -File -Filter "Smirel.ListingStudio*-Portable.zip")
          if ($nativeSetup.Count -ne 1) { throw "Expected exactly one native Setup, found $($nativeSetup.Count)" }
          if ($nativeMsi.Count -ne 1) { throw "Expected exactly one native MSI, found $($nativeMsi.Count)" }
          if ($nativePortable.Count -ne 1) { throw "Expected exactly one native Portable, found $($nativePortable.Count)" }

          $friendlySetup = Get-Item "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          $friendlyMsi = Get-Item "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi"
          $friendlyPortable = Get-Item "artifacts\EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          "target_full=$targetFull" >> $env:GITHUB_ENV
          "friendly_setup_sha=$((Get-FileHash $friendlySetup.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
          "friendly_setup_size=$($friendlySetup.Length)" >> $env:GITHUB_ENV
          "friendly_msi_sha=$((Get-FileHash $friendlyMsi.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
          "friendly_msi_size=$($friendlyMsi.Length)" >> $env:GITHUB_ENV

      - name: Silent branded MSI install and uninstall smoke test
        shell: pwsh
        run: |
          .\scripts\test_velopack_msi.ps1 `
            -MsiPath "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi" `
            -ExpectedVersion $env:UPDATE_VERSION `
            -InstallDir (Join-Path $env:RUNNER_TEMP "ListingStudioStableMsiSmoke")

      - name: Silent Velopack Setup smoke test
        shell: pwsh
        run: |
          $setup = "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "ListingStudioStableSmoke"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $process = Start-Process -FilePath $setup -ArgumentList @("--silent", "--installto", $installDir) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Velopack Setup install failed: $($process.ExitCode)" }
          foreach ($required in @(
            (Join-Path $installDir "EcommerceAgent.exe"),
            (Join-Path $installDir "Update.exe"),
            (Join-Path $installDir "current\EcommerceAgentWorker.exe"),
            (Join-Path $installDir "current\_internal\packaging\VERSION")
          )) {
            if (-not (Test-Path $required)) { throw "Installed component missing: $required" }
          }
          $versionFile = Join-Path $installDir "current\_internal\packaging\VERSION"
          if ((Get-Content $versionFile -Raw).Trim() -ne $env:UPDATE_VERSION) { throw "Installed VERSION mismatch" }
          & (Join-Path $installDir "current\EcommerceAgentWorker.exe") --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed worker self-test failed: $LASTEXITCODE" }

      - name: Upload verified assets to existing Stable draft
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $native = @(Get-ChildItem "artifacts\velopack" -File | ForEach-Object { $_.FullName })
          if ($native.Count -eq 0) { throw "No Velopack assets available for upload" }
          & gh release upload $tag @native --clobber
          if ($LASTEXITCODE -ne 0) { throw "Native Velopack asset upload failed: $LASTEXITCODE" }
          & gh release upload $tag `
            "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.exe" `
            "artifacts\EcommerceAgent-Setup-$env:UPDATE_VERSION.msi" `
            "artifacts\EcommerceAgent-$env:UPDATE_VERSION-portable.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Friendly release asset upload failed: $LASTEXITCODE" }

      - name: Verify complete draft before publication
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $draft = gh release view $tag --json databaseId,tagName,name,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($draft.tagName -ne $tag) { throw "Draft tag mismatch" }
          if ($draft.name -ne $env:RELEASE_NAME) { throw "Draft release name mismatch" }
          if (-not $draft.isDraft) { throw "Release became public before verification" }
          if ($draft.isPrerelease) { throw "Stable draft unexpectedly marked prerelease" }
          $names = @($draft.assets | ForEach-Object { $_.name })
          $localVelopack = @(Get-ChildItem "artifacts\velopack" -File | ForEach-Object { $_.Name })
          foreach ($expected in @($localVelopack) + @(
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe",
            "EcommerceAgent-Setup-$env:UPDATE_VERSION.msi",
            "EcommerceAgent-$env:UPDATE_VERSION-portable.zip"
          )) {
            if ($expected -notin $names) { throw "Draft release asset missing: $expected" }
          }

          $apiRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draft.databaseId)" | ConvertFrom-Json
          foreach ($item in @(
            @{ Name = "EcommerceAgent-Setup-$env:UPDATE_VERSION.exe"; Size = [int64]$env:friendly_setup_size; Digest = "sha256:$env:friendly_setup_sha" },
            @{ Name = "EcommerceAgent-Setup-$env:UPDATE_VERSION.msi"; Size = [int64]$env:friendly_msi_size; Digest = "sha256:$env:friendly_msi_sha" }
          )) {
            $asset = @($apiRelease.assets | Where-Object { $_.name -eq $item.Name })
            if ($asset.Count -ne 1) { throw "Draft asset is not unique: $($item.Name)" }
            if ([int64]$asset[0].size -ne $item.Size) { throw "Draft asset size mismatch: $($item.Name)" }
            if ([string]$asset[0].digest -ne $item.Digest) { throw "Draft asset SHA256 mismatch: $($item.Name)" }
          }

      - name: Publish verified Stable release
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified Stable draft: $LASTEXITCODE" }

      - name: Verify published Stable contract
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $release = gh release view $tag --json tagName,name,isDraft,isPrerelease | ConvertFrom-Json
          if ($release.tagName -ne $tag -or $release.name -ne $env:RELEASE_NAME) { throw "Published release identity mismatch" }
          if ($release.isDraft -or $release.isPrerelease) { throw "Stable release publication flags are invalid" }

      - name: Cleanup failed Stable draft and tag
        if: ${{ failure() }}
        shell: pwsh
        run: |
          $tag = "v$env:UPDATE_VERSION"
          $raw = gh release view $tag --json isDraft,tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $raw | ConvertFrom-Json
            if ($release.isDraft) {
              Write-Host "Removing failed Stable draft and tag: $tag"
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup draft $tag" }
              exit 0
            }
            Write-Warning "Release $tag is already public; cleanup intentionally refused"
            exit 0
          }
          $global:LASTEXITCODE = 0
          $remoteTag = (& git ls-remote --tags origin "refs/tags/$tag" 2>$null | Out-String).Trim()
          $global:LASTEXITCODE = 0
          if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
            Write-Host "Removing orphan release tag after pre-publication failure: $tag"
            & git push origin ":refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to cleanup orphan tag $tag" }
          }

      - name: Upload published files to workflow run
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Stable-${{ inputs.version }}
          path: |
            artifacts/EcommerceAgent-Setup-${{ inputs.version }}.exe
            artifacts/EcommerceAgent-Setup-${{ inputs.version }}.msi
            artifacts/EcommerceAgent-${{ inputs.version }}-portable.zip
            artifacts/velopack/*
          if-no-files-found: error
          retention-days: 30
