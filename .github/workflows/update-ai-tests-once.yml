name: update-ai-tests-once
on:
  push:
    branches:
      - feat/review-preview-gate
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/review-preview-gate
          fetch-depth: 0
      - name: Align expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_makro_resolve_ai.py')
          s = p.read_text()
          s = s.replace('assert captured["config"].structured_mode == "prompt_only"', 'assert captured["config"].structured_mode == "json_object"')
          s = s.replace('assert structured.default == "auto"', 'assert structured.default == "json_object"')
          p.write_text(s)
          PY
          rm .github/workflows/update-ai-tests-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align AI resolver default expectations'
          git push origin HEAD:feat/review-preview-gate