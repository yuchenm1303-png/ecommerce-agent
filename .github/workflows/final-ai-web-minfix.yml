name: final-ai-web-minfix
on:
  push:
    branches:
      - feat/review-preview-gate
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/review-preview-gate
          fetch-depth: 0
      - name: Apply minimal production fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('makro_resolve_ai.py')
          s = p.read_text()
          s = s.replace('parser.add_argument("--model", required=True)', 'parser.add_argument("--model", default="qwen3.6-plus", help="本地商品解析模型；默认 qwen3.6-plus。")')
          s = s.replace('default="auto",\n        help="auto: Qwen Omni 自动使用原生 JSON mode；其他 compatible provider 保持兼容模式。",', 'default="json_object",\n        help="本地 Qwen3.6 默认使用原生 JSON mode；需要兼容旧服务时可显式改为 prompt_only。",')
          s = s.replace('parser.set_defaults(enable_thinking=None)', 'parser.set_defaults(enable_thinking=False)')
          s = s.replace('"auto: 仅当第一遍 AI 对 unresolved 字段给出 search_queries 且使用 DashScope Qwen 时，"\n            "追加一次带来源联网搜索；off: 完全不联网。"', '"auto: 对第一遍仍 unresolved 的非经营字段追加最多一次带来源联网研究；off: 完全不联网。"')
          s = s.replace('"--web-native-base-url",\n        default="https://dashscope.aliyuncs.com/api/v1",\n        help="DashScope 原生 API base URL，用于返回真实 search sources。",', '"--web-base-url",\n        default="",\n        help="Responses API base URL；默认复用 --base-url。",')
          s = s.replace('native_base_url=args.web_native_base_url,', 'base_url=args.web_base_url.strip() or config.base_url,')
          s = s.replace('if decision.status not in {MISSING, REVIEW, CONFLICT} or not decision.search_queries:\n            continue', 'if decision.status not in {MISSING, REVIEW, CONFLICT}:\n            continue')
          p.write_text(s)

          p = Path('app/web_enrichment.py')
          s = p.read_text()
          s = s.replace('if decision.status in WEB_UPDATABLE_STATUSES and decision.search_queries:\n            output.append((field, decision))', 'if decision.status in WEB_UPDATABLE_STATUSES:\n            output.append((field, decision))')
          s = s.replace('"Use each target\'s search_queries as the research starting point and combine searches when efficient.",', '"Use each target\'s search_queries when present; otherwise derive a focused query from exact product identity plus that field. Combine searches when efficient.",')
          p.write_text(s)

          p = Path('tests/test_ai_prompt_contract.py')
          s = p.read_text()
          marker = 'def test_cli_defaults_target_plus_and_json_mode():'
          if marker not in s:
              s += '''\n\ndef test_cli_defaults_target_plus_and_json_mode():\n    from makro_resolve_ai import build_parser\n    parser = build_parser()\n    args = parser.parse_args([\"--qa\", \"q.xlsx\", \"--live-schema\", \"live.json\"])\n    assert args.model == \"qwen3.6-plus\"\n    assert args.structured_mode == \"json_object\"\n    assert args.enable_thinking is False\n'''
          p.write_text(s)
          PY
          rm .github/workflows/final-ai-web-minfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use Qwen Plus and Responses web search'
          git push origin HEAD:feat/review-preview-gate