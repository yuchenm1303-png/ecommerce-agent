name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-test-gui
    tags:
      - "v*"
    paths:
      - "app/app_branding.py"
      - "app/app_icon_data.py"
      - "app/runtime_paths.py"
      - "app/velopack_runtime.py"
      - "app/update_browser_gate.py"
      - "app/browser_session.py"
      - "gui/app_updater.py"
      - "gui/update_panel.py"
      - "gui/native_window_shell.py"
      - "gui/browser_session_manager.py"
      - "gui/resilient_app_updater.py"
      - "gui/update_runtime.py"
      - "gui/frozen_process_router.py"
      - "run_packaged_worker.py"
      - "run_local_gui.py"
      - "packaging/**"
      - "scripts/build_windows.ps1"
      - "scripts/test_velopack_update_e2e.ps1"
      - "scripts/test_velopack_msi.ps1"
      - "scripts/generate_app_icon.py"
      - ".config/dotnet-tools.json"
      - "requirements.txt"
      - "requirements-gui.txt"
      - "requirements-build.txt"
      - "tests/test_windows_packaging_contract.py"
      - "tests/test_velopack_update_contract.py"
      - "tests/test_app_update_ui_contract.py"
      - "tests/test_updater_browser_shutdown_contract.py"
      - ".github/workflows/windows-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide full installer gate
        id: installer_gate
        shell: pwsh
        run: |
          $full = $env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -or $env:GITHUB_REF -like "refs/tags/v*"
          if (-not $full -and $env:GITHUB_EVENT_NAME -eq "push") {
            $before = "${{ github.event.before }}"
            if (-not [string]::IsNullOrWhiteSpace($before) -and $before -notmatch '^0+$') {
              $changed = @(git diff --name-only $before $env:GITHUB_SHA)
            }
            else {
              $changed = @(git show --pretty="" --name-only $env:GITHUB_SHA)
            }
            $installerSensitive = @(
              "app/app_branding.py",
              "app/app_icon_data.py",
              "packaging/",
              "scripts/build_windows.ps1",
              "scripts/test_velopack_msi.ps1",
              "scripts/generate_app_icon.py",
              ".config/dotnet-tools.json",
              "requirements-build.txt",
              "tests/test_windows_packaging_contract.py",
              ".github/workflows/windows-package.yml"
            )
            foreach ($path in $changed) {
              foreach ($prefix in $installerSensitive) {
                if ($path -eq $prefix -or $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                  $full = $true
                  break
                }
              }
              if ($full) { break }
            }
          }
          $value = $full.ToString().ToLowerInvariant()
          "full_msi=$value" >> $env:GITHUB_OUTPUT
          Write-Host "Full MSI/WiX gate: $value"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-gui.txt -r requirements-build.txt
          dotnet tool restore

      - name: Velopack packaging contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_velopack_update_contract.py `
            tests/test_app_update_ui_contract.py `
            tests/test_updater_browser_shutdown_contract.py

      - name: Build branded Velopack package
        shell: pwsh
        run: |
          if ("${{ steps.installer_gate.outputs.full_msi }}" -eq "true") {
            .\scripts\build_windows.ps1
          }
          else {
            .\scripts\build_windows.ps1 -SkipMsi
          }

      - name: Silent branded MSI install and uninstall smoke test
        if: ${{ steps.installer_gate.outputs.full_msi == 'true' }}
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content packaging\VERSION -Raw).Trim()
          .\scripts\test_velopack_msi.ps1 `
            -MsiPath "artifacts\EcommerceAgent-Setup-$expectedVersion.msi" `
            -ExpectedVersion $expectedVersion `
            -InstallDir (Join-Path $env:RUNNER_TEMP "ListingStudioMsiInstalled")

      - name: Silent Velopack Setup smoke test
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem artifacts\EcommerceAgent-Setup-*.exe -File)
          if ($setups.Count -ne 1) { throw "Expected exactly one friendly Velopack Setup artifact, found $($setups.Count)" }
          $setup = $setups[0]
          $expectedVersion = (Get-Content packaging\VERSION -Raw).Trim()
          $installDir = Join-Path $env:RUNNER_TEMP "ListingStudioVelopackInstalled"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @(
            "--silent", "--installto", $installDir
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Velopack Setup install failed: $($install.ExitCode)" }

          $stub = Join-Path $installDir "EcommerceAgent.exe"
          $update = Join-Path $installDir "Update.exe"
          $gui = Join-Path $installDir "current\EcommerceAgent.exe"
          $worker = Join-Path $installDir "current\EcommerceAgentWorker.exe"
          $versionFile = Join-Path $installDir "current\_internal\packaging\VERSION"
          foreach ($required in @($stub, $update, $gui, $worker, $versionFile)) {
            if (-not (Test-Path $required)) { throw "Velopack installed component missing: $required" }
          }
          $installedVersion = (Get-Content $versionFile -Raw).Trim()
          if ($installedVersion -ne $expectedVersion) {
            throw "Installed VERSION mismatch: expected=$expectedVersion actual=$installedVersion"
          }
          & $worker --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed worker self-test failed: $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Windows-${{ github.sha }}
          path: |
            artifacts/EcommerceAgent-Setup-*.exe
            artifacts/EcommerceAgent-Setup-*.msi
            artifacts/EcommerceAgent-*-portable.zip
            artifacts/velopack/*
          if-no-files-found: error
          retention-days: 14
