name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-test-gui
    tags:
      - "v*"
    paths:
      - "app/runtime_paths.py"
      - "app/app_branding.py"
      - "app/app_icon_data.py"
      - "gui/frozen_process_router.py"
      - "run_packaged_worker.py"
      - "run_local_gui.py"
      - "packaging/**"
      - "scripts/build_windows.ps1"
      - "scripts/generate_app_icon.py"
      - "requirements.txt"
      - "requirements-gui.txt"
      - "requirements-build.txt"
      - "tests/test_windows_packaging_contract.py"
      - ".github/workflows/windows-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt

      - name: Packaging contracts
        shell: pwsh
        run: python -m pytest -q tests/test_windows_packaging_contract.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable package
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Silent installer smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts\EcommerceAgent-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer artifact not found" }

          $installDir = Join-Path $env:RUNNER_TEMP "EcommerceAgentInstalled"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          $setupLog = Join-Path $env:RUNNER_TEMP "ecommerce-agent-setup.log"
          if (Test-Path $setupLog) {
            Remove-Item $setupLog -Force
          }

          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installDir",
            "/LOG=$setupLog"
          )
          $install = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -Wait -PassThru
          Write-Host "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) {
            if (Test-Path $setupLog) {
              Write-Host "---- Inno Setup log (tail) ----"
              Get-Content $setupLog -Tail 120
            }
            throw "Silent install failed with exit code $($install.ExitCode)"
          }

          if (-not (Test-Path $installDir)) {
            if (Test-Path $setupLog) {
              Write-Host "---- Inno Setup log (tail) ----"
              Get-Content $setupLog -Tail 120
            }
            throw "Installer reported success but install directory is missing: $installDir"
          }

          Write-Host "Top-level installed files:"
          Get-ChildItem $installDir | Format-Table Name, Length, Mode

          $worker = Join-Path $installDir "EcommerceAgentWorker.exe"
          $internal = Join-Path $installDir "_internal"
          if (-not (Test-Path $worker)) { throw "Installed worker missing: $worker" }
          if (-not (Test-Path $internal)) { throw "Installed _internal directory missing: $internal" }

          & $worker --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Installed worker self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Windows-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
