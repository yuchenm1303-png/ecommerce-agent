name: Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - feat/local-test-gui
    tags:
      - "v*"
    paths:
      - "app/runtime_paths.py"
      - "app/app_branding.py"
      - "app/app_icon_data.py"
      - "app/updater_core.py"
      - "gui/__init__.py"
      - "gui/app_access.py"
      - "gui/app_updater.py"
      - "gui/resilient_app_updater.py"
      - "gui/update_runtime.py"
      - "gui/frozen_process_router.py"
      - "run_packaged_worker.py"
      - "run_local_gui.py"
      - "packaging/**"
      - "scripts/updater_main.py"
      - "scripts/build_windows.ps1"
      - "scripts/test_windows_update_e2e.ps1"
      - "scripts/generate_app_icon.py"
      - "requirements.txt"
      - "requirements-gui.txt"
      - "requirements-build.txt"
      - "tests/test_windows_packaging_contract.py"
      - "tests/test_update_delivery_contract.py"
      - "tests/test_updater_core_contract.py"
      - "tests/test_resilient_app_updater_contract.py"
      - "tests/test_updater_onefile_contract.py"
      - "tests/test_update_chain_contract.py"
      - "tests/windows_updater_e2e_parent.py"
      - ".github/workflows/windows-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gui.txt -r requirements-build.txt

      - name: Full update-chain contracts
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_windows_packaging_contract.py `
            tests/test_update_delivery_contract.py `
            tests/test_updater_core_contract.py `
            tests/test_resilient_app_updater_contract.py `
            tests/test_updater_onefile_contract.py `
            tests/test_update_chain_contract.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable package
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Silent installer smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts\EcommerceAgent-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer artifact not found" }

          $installDir = Join-Path $env:RUNNER_TEMP "EcommerceAgentInstalled"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $setupLog = Join-Path $env:RUNNER_TEMP "ecommerce-agent-setup.log"
          if (Test-Path $setupLog) { Remove-Item $setupLog -Force }

          $install = Start-Process -FilePath $setup.FullName -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir", "/LOG=$setupLog"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog -Tail 120 }
            throw "Silent install failed with exit code $($install.ExitCode)"
          }

          $gui = Join-Path $installDir "EcommerceAgent.exe"
          $worker = Join-Path $installDir "EcommerceAgentWorker.exe"
          $updater = Join-Path $installDir "updater\updater.exe"
          $internal = Join-Path $installDir "_internal"
          $versionFile = Join-Path $internal "packaging\VERSION"
          foreach ($required in @($gui, $worker, $updater, $internal, $versionFile)) {
            if (-not (Test-Path $required)) { throw "Installed package component missing: $required" }
          }
          if (Test-Path (Join-Path $installDir "updater\_internal")) {
            throw "Standalone updater unexpectedly depends on an installed _internal directory"
          }

          & $worker --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Installed worker self-test failed with exit code $LASTEXITCODE"
          }
          & $updater --self-check
          if ($LASTEXITCODE -ne 0) {
            throw "Installed updater self-check failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcommerceAgent-Windows-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
